name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    name: node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm lint` runs ESLint — including the dogfooded
      # fhirpath/no-invalid-expressions rule, i.e. the spec §11 analyzer over the
      # library source — followed by a Prettier format check.
      - name: Lint (ESLint + FHIRPath analyzer + Prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Coverage thresholds (vitest.config.ts) only guarantee anything if CI
      # actually measures coverage, so the test step runs `pnpm coverage`.
      - name: Test (with coverage thresholds)
        run: pnpm coverage
