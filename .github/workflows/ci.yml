name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    name: node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm lint` runs ESLint — including the dogfooded
      # fhirpath/no-invalid-expressions rule, i.e. the spec §11 analyzer over the
      # library source — followed by a Prettier format check.
      - name: Lint (ESLint + FHIRPath analyzer + Prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Coverage thresholds (vitest.config.ts) only guarantee anything if CI
      # actually measures coverage, so the test step runs `pnpm coverage`.
      - name: Test (with coverage thresholds)
        run: pnpm coverage

  # The demo is its own npm project, so the root install and `pnpm typecheck`
  # (which covers `src` only) never reach it. Its own job does.
  demo:
    runs-on: ubuntu-latest
    name: demo
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # The declaration generator reads the library from source, so both projects
      # need their dependencies.
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix demo

      - name: Typecheck
        run: npm run typecheck --prefix demo

      # demo/src/monaco/*.d.ts is generated and committed. If the library's types
      # move without it being regenerated, the playground type-checks the reader's
      # code against declarations that no longer describe the package.
      - name: Generated declarations are current
        run: |
          npm run generate:dts --prefix demo
          git diff --exit-code -- demo/src/monaco

      - name: Build
        run: npm run build --prefix demo
